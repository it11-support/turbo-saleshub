services:
  redis:
    image: redis:7-alpine
    container_name: saleshub-redis-dev
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - saleshub_redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  saleshub_redis_data: